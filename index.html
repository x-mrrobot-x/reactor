<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
    <title>Reactor</title>
    <style>
      :root {
  --bg: #0b0d12;
  --surface: #12151c;
  --surface-2: #171b24;
  --surface-3: #1e2330;
  --border: #232838;
  --border-soft: #1a1e28;
  --text: #e7e9ee;
  --text-dim: #8b93a6;
  --text-faint: #545c6e;
  --accent: #e8a33d;
  --accent-dim: #6b4e22;
  --accent-soft: rgba(232, 163, 61, 0.12);
  --ok: #4fbf82;
  --danger: #e2584a;
  --mono:
    ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
  --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}
:root[data-theme="light"] {
  --bg: #f3f1ea;
  --surface: #ffffff;
  --surface-2: #f2f0e7;
  --surface-3: #e8e4d6;
  --border: #ddd7c4;
  --border-soft: #e6e1d1;
  --text: #201d16;
  --text-dim: #6c6656;
  --text-faint: #9d9683;
  --accent: #a86a1a;
  --accent-dim: #ecd7ac;
  --accent-soft: rgba(168, 106, 26, 0.12);
  --ok: #2f8f5b;
  --danger: #bb3d2c;
}
* {
  box-sizing: border-box;
}
html,
body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  -webkit-tap-highlight-color: transparent;
  transition:
    background 0.15s,
    color 0.15s;
}
body {
  padding-bottom: 90px;
}
button {
  font-family: inherit;
  cursor: pointer;
  border: 0;
  background: none;
  color: inherit;
  -webkit-tap-highlight-color: transparent;
}
:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 2px;
}

header {
  position: sticky;
  top: 0;
  z-index: 10;
  overflow: hidden;
  background: linear-gradient(180deg, var(--surface-2) 0%, var(--bg) 100%);
  border-bottom: 1px solid var(--border);
  padding: 18px 16px 14px;
}
header::before {
  content: "";
  position: absolute;
  inset: 0;
  opacity: 0.05;
  background-image:
    linear-gradient(var(--text-faint) 1px, transparent 1px),
    linear-gradient(90deg, var(--text-faint) 1px, transparent 1px);
  background-size: 22px 22px;
  pointer-events: none;
}
.header-inner {
  position: relative;
  z-index: 1;
}
.brand {
  display: flex;
  align-items: center;
  gap: 8px;
}
.brand-mark {
  color: var(--accent);
  display: flex;
  padding: 6px;
  flex-shrink: 0;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
}
.logo-img {
  width: 24px;
  height: 24px;
  object-fit: cover;
}
.brand-word {
  font-family: var(--mono);
  font-size: 19px;
  font-weight: 700;
  letter-spacing: 0.09em;
}
.tagline {
  font-size: 12px;
  color: var(--text-dim);
  margin: 6px 0 0;
  line-height: 1.45;
  max-width: 38ch;
}

.power {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 11px 14px;
  margin-top: 14px;
}
.led {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--text-faint);
  flex-shrink: 0;
  transition: background 0.2s;
}
.led.on {
  background: var(--ok);
  box-shadow: 0 0 8px 1px rgba(79, 191, 130, 0.55);
  animation: ledPulse 2.4s ease-in-out infinite;
}
.led.off {
  background: var(--danger);
  box-shadow: 0 0 8px 1px rgba(226, 88, 74, 0.3);
}
.led.restarting {
  background: var(--accent);
  box-shadow: 0 0 8px 1px rgba(232, 163, 61, 0.45);
  animation: ledPulseAccent 0.9s ease-in-out infinite;
}
@keyframes ledPulse {
  0%,
  100% {
    box-shadow: 0 0 8px 1px rgba(79, 191, 130, 0.5);
  }
  50% {
    box-shadow: 0 0 13px 3px rgba(79, 191, 130, 0.75);
  }
}
@keyframes ledPulseAccent {
  0%,
  100% {
    box-shadow: 0 0 8px 1px rgba(232, 163, 61, 0.45);
  }
  50% {
    box-shadow: 0 0 13px 3px rgba(232, 163, 61, 0.8);
  }
}
.power-info {
  flex: 1;
  min-width: 0;
}
.power-info b {
  display: block;
  font-size: 13.5px;
  font-weight: 600;
}
.power-info span {
  font-size: 11px;
  color: var(--text-dim);
  font-family: var(--mono);
  letter-spacing: 0.03em;
}

.switch {
  position: relative;
  width: 46px;
  height: 26px;
  flex-shrink: 0;
}
.switch.sm {
  width: 38px;
  height: 22px;
}
.switch input {
  position: absolute;
  opacity: 0;
  inset: 0;
  margin: 0;
  cursor: pointer;
  z-index: 2;
}
.switch input:disabled {
  cursor: not-allowed;
}
.switch input:disabled + .track,
.switch input:disabled + .track + .knob {
  opacity: 0.55;
}
.switch .track {
  position: absolute;
  inset: 0;
  background: #242a38;
  border-radius: 14px;
  border: 1px solid var(--border);
  transition: background 0.18s;
}
:root[data-theme="light"] .switch .track {
  background: #e2ddcc;
}
.switch .knob {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 20px;
  height: 20px;
  border-radius: 50%;
  background: #7a8194;
  transition:
    transform 0.18s,
    background 0.18s;
}
.switch.sm .knob {
  width: 16px;
  height: 16px;
}
.switch input:checked + .track {
  background: var(--accent-dim);
}
.switch input:checked + .track + .knob {
  transform: translateX(20px);
  background: var(--accent);
}
.switch.sm input:checked + .track + .knob {
  transform: translateX(16px);
}

.tabs {
  display: flex;
  gap: 6px;
  margin: 14px 16px 4px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 4px;
}
.tab {
  flex: 1;
  padding: 9px 6px;
  border-radius: 9px;
  font-size: 12px;
  font-weight: 600;
  color: var(--text-dim);
  transition:
    background 0.15s,
    color 0.15s;
}
.tab.active {
  background: var(--surface-3);
  color: var(--text);
  box-shadow: inset 0 -2px 0 var(--accent);
}

main {
  padding: 4px 16px 0;
}

.page-head {
  margin: 16px 2px 16px;
}
.page-head-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
}
.page-head-top h2 {
  font-family: var(--mono);
  font-size: 16px;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin: 0;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.page-head-actions {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.btn-header-add {
  display: flex;
  align-items: center;
  gap: 5px;
  padding: 6px 10px;
  border: 1px solid var(--accent-dim);
  border-radius: 8px;
  background: var(--accent-soft);
  color: var(--accent);
  font-size: 11.5px;
  font-weight: 700;
  flex-shrink: 0;
}
.btn-header-add:active {
  background: var(--accent-dim);
  color: #1a1408;
}
.page-stats {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-top: 10px;
  padding: 9px 9px 9px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
}
.page-stats-info {
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 0;
  font-family: var(--mono);
  font-size: 11.5px;
  color: var(--text-dim);
}
.page-stats-info .count {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chip {
  font-size: 9.5px;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 2px 7px;
  border-radius: 20px;
  border: 1px solid;
  font-family: var(--sans);
  font-weight: 700;
}
.chip.ok {
  color: var(--ok);
  border-color: rgba(79, 191, 130, 0.35);
  background: rgba(79, 191, 130, 0.08);
}

.section-label,
.editor-section-label {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  color: var(--text-faint);
  text-transform: uppercase;
  margin: 0 2px 8px;
}
.editor-section-label {
  display: flex;
  align-items: baseline;
  gap: 6px;
}
.editor-section-label .n {
  color: var(--accent);
}

.field-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 12px;
}
.field-row label {
  font-size: 11.5px;
  color: var(--text-dim);
  width: 84px;
  flex-shrink: 0;
}
.field-row input[type="text"],
.field-row input[type="number"] {
  flex: 1;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  font-family: var(--mono);
  min-width: 0;
}
.field-row select {
  flex: 1;
}
.field-row input[type="checkbox"] {
  width: 18px;
  height: 18px;
  accent-color: var(--accent);
}
.field-block {
  margin-bottom: 12px;
}
.field-block .block-label {
  display: block;
  font-size: 11.5px;
  color: var(--text-dim);
  margin-bottom: 5px;
}
.btn {
  font-family: var(--sans);
  font-size: 12.5px;
  font-weight: 600;
  border-radius: 8px;
  padding: 8px 14px;
}
.btn-accent {
  background: var(--accent);
  color: #1a1408;
}
.btn-ghost {
  border: 1px solid var(--border);
  color: var(--text-dim);
}

.section {
  margin-bottom: 20px;
}
.empty-hint {
  font-size: 12px;
  color: var(--text-faint);
  font-style: italic;
  padding: 4px 2px;
}

select,
textarea {
  width: 100%;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  font-family: var(--sans);
}
textarea {
  min-height: 56px;
  resize: vertical;
}
.hint {
  font-size: 10.5px;
  color: var(--text-faint);
  margin-top: 2px;
}

.icon-btn {
  width: 28px;
  height: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text-dim);
  flex-shrink: 0;
}
.icon-btn.danger:active {
  color: var(--danger);
  border-color: rgba(226, 88, 74, 0.4);
}
.icon-btn:disabled {
  opacity: 0.35;
  cursor: not-allowed;
}

/* ---- Dashboard ---- */
.stat-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 18px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 12px;
}
.stat-value {
  font-family: var(--mono);
  font-size: 20px;
  font-weight: 700;
  color: var(--text);
}
.stat-label {
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-dim);
}
.flow-diagram {
  margin-bottom: 18px;
}
.flow-track {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 14px 10px;
  overflow-x: auto;
}
.flow-node {
  flex-shrink: 0;
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.03em;
  color: var(--text-dim);
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 7px 10px;
  white-space: nowrap;
}
.flow-arrow {
  flex-shrink: 0;
  color: var(--text-faint);
  font-size: 13px;
}
.flow-track.live .flow-node {
  color: var(--accent);
  border-color: var(--accent-dim);
  background: var(--accent-soft);
}
.flow-track.live .flow-arrow {
  color: var(--accent);
}
.power-card {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 16px;
  margin-bottom: 18px;
}
.power-card-label {
  display: flex;
  flex-direction: column;
  gap: 3px;
  min-width: 0;
}
.power-card-label b {
  font-size: 14px;
}
.power-card-label span {
  font-size: 11.5px;
  color: var(--text-dim);
}
.power-toggle-btn {
  flex-shrink: 0;
  font-family: var(--mono);
  font-weight: 700;
  font-size: 12px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
  padding: 10px 18px;
  border-radius: 10px;
  background: var(--surface-3);
  border: 1px solid var(--border);
  color: var(--text-dim);
}
.power-toggle-btn.on {
  background: var(--accent);
  color: #1a1408;
  border-color: var(--accent);
}
.power-toggle-btn.restarting {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: var(--accent-dim);
  cursor: not-allowed;
}
.power-toggle-btn:disabled {
  cursor: not-allowed;
}

/* ---- Regras ---- */
.rule-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.rule-row {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  padding: 12px;
  border-bottom: 1px solid var(--border-soft);
}
.rule-row:last-child {
  border-bottom: none;
}
.rule-row.off {
  opacity: 0.5;
}
.rule-dot {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--ok);
  margin-top: 6px;
  flex-shrink: 0;
  cursor: pointer;
}
.rule-row.off .rule-dot {
  background: var(--text-faint);
}
.rule-info {
  flex: 1;
  min-width: 0;
}
.rule-top {
  display: flex;
  align-items: center;
  gap: 8px;
  flex-wrap: wrap;
}
.rule-name {
  font-size: 13.5px;
  font-weight: 600;
}
.provider-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  font-size: 10px;
  font-family: var(--mono);
  color: var(--text-faint);
  border: 1px solid var(--border);
  border-radius: 20px;
  padding: 2px 8px 2px 6px;
  flex-shrink: 0;
}
.provider-badge svg {
  width: 11px;
  height: 11px;
}
.rule-flow {
  margin-top: 5px;
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  font-family: var(--mono);
  color: var(--text-dim);
  flex-wrap: wrap;
}
.flow-sep {
  color: var(--text-faint);
}
.rule-actions {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

/* ---- Providers ---- */
.provider-list {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  overflow: hidden;
}
.provider-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 13px 12px;
  border-bottom: 1px solid var(--border-soft);
}
.provider-row:last-child {
  border-bottom: none;
}
.provider-row.off {
  opacity: 0.55;
}
.provider-icon {
  width: 34px;
  height: 34px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 10px;
  color: var(--accent);
}
.provider-row.off .provider-icon {
  color: var(--text-faint);
}
.provider-info {
  flex: 1;
  min-width: 0;
}
.provider-name-row {
  display: flex;
  align-items: center;
  gap: 8px;
}
.provider-name {
  font-size: 13.5px;
  font-weight: 600;
}
.provider-desc {
  margin-top: 2px;
  font-size: 11.5px;
  color: var(--text-dim);
}

/* ---- Editor de Regra ---- */
.dialog-overlay {
  position: fixed;
  inset: 0;
  z-index: 60;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(6, 7, 10, 0.6);
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  animation: overlayIn 0.16s ease-out;
}
.dialog {
  width: min(420px, 100%);
  max-height: 84vh;
  overflow-y: auto;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
  animation: dialogIn 0.16s ease-out;
}
.dialog.wide {
  width: min(480px, 100%);
}
@keyframes overlayIn {
  from {
    opacity: 0;
  }
  to {
    opacity: 1;
  }
}
@keyframes dialogIn {
  from {
    opacity: 0;
    transform: translateY(8px) scale(0.98);
  }
  to {
    opacity: 1;
    transform: none;
  }
}
@media (prefers-reduced-motion: reduce) {
  .led.on,
  .led.restarting,
  .dialog,
  .dialog-overlay,
  #toast .msg {
    animation: none;
  }
}
.dialog-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 14px;
  gap: 10px;
}
.dialog-head b {
  font-family: var(--mono);
  font-size: 15px;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.dialog-close {
  width: 26px;
  height: 26px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-faint);
  border-radius: 7px;
  flex-shrink: 0;
}
.dialog-close:active {
  background: var(--surface-3);
}
.dialog-foot {
  display: flex;
  justify-content: flex-end;
  gap: 8px;
  margin-top: 16px;
}
.editor-section {
  margin-bottom: 18px;
}
.condition-row {
  display: flex;
  gap: 8px;
  align-items: center;
  margin-bottom: 8px;
}
.condition-row select {
  flex: 0 0 112px;
}
.condition-row input {
  flex: 1;
  min-width: 0;
  background: var(--surface-2);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  padding: 8px 10px;
  font-size: 13px;
  font-family: var(--mono);
}
.condition-op-label {
  flex: 0 0 112px;
  font-size: 12px;
  color: var(--text-dim);
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 8px 10px;
  font-family: var(--mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.action-card {
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 10px;
  margin-bottom: 8px;
}
.action-card-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-bottom: 8px;
  flex-wrap: wrap;
}
.action-card-head select {
  flex: 1;
  min-width: 120px;
}
.action-card-move {
  display: flex;
  gap: 4px;
  flex-shrink: 0;
}
.action-card-fields .field-row,
.action-card-fields .field-block {
  margin-bottom: 8px;
}
.action-card-fields .field-row:last-child,
.action-card-fields .field-block:last-child {
  margin-bottom: 0;
}
.action-card-fields .field-row label {
  width: 68px;
}
.add-row-btn {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11.5px;
  font-weight: 600;
  color: var(--accent);
  border: 1px dashed var(--accent-dim);
  border-radius: 9px;
  padding: 9px 10px;
  width: 100%;
  justify-content: center;
}

/* ---- Config ---- */
.settings-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 12px;
}
.settings-card .field-row:last-child {
  margin-bottom: 0;
}
.backup-row {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.backup-row .btn {
  flex: 1;
  min-width: 132px;
  text-align: center;
}
.about-line {
  display: flex;
  justify-content: space-between;
  gap: 10px;
  padding: 7px 0;
  border-bottom: 1px solid var(--border-soft);
  font-size: 12.5px;
}
.about-line:last-child {
  border-bottom: none;
}
.about-label {
  color: var(--text-dim);
}
.about-value {
  font-family: var(--mono);
  color: var(--text);
}

#toast {
  position: fixed;
  left: 0;
  right: 0;
  bottom: max(20px, env(safe-area-inset-bottom, 0px) + 12px);
  z-index: 70;
  display: none;
  justify-content: center;
  padding: 0 16px;
  pointer-events: none;
}
#toast .msg {
  display: inline-flex;
  align-items: center;
  gap: 9px;
  max-width: 100%;
  background: var(--surface-3);
  border: 1px solid var(--border);
  border-radius: 999px;
  padding: 10px 16px;
  font-size: 12.5px;
  font-weight: 500;
  color: var(--text);
  box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
  pointer-events: auto;
  animation: toastIn 0.18s ease-out;
}
#toast .msg .toast-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--text-faint);
  flex-shrink: 0;
}
#toast .msg .toast-text {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
#toast .msg.err .toast-dot {
  background: var(--danger);
  box-shadow: 0 0 6px 1px rgba(226, 88, 74, 0.5);
}
#toast .msg.ok .toast-dot {
  background: var(--ok);
  box-shadow: 0 0 6px 1px rgba(79, 191, 130, 0.5);
}
@keyframes toastIn {
  from {
    opacity: 0;
    transform: translateY(6px);
  }
  to {
    opacity: 1;
    transform: none;
  }
}

#loading {
  position: fixed;
  inset: 0;
  background: rgba(11, 13, 18, 0.6);
  z-index: 50;
  display: none;
  align-items: center;
  justify-content: center;
  font-family: var(--mono);
  font-size: 12px;
  color: var(--text-dim);
}

    <script>
      "use strict";

      const TASK_NAME = "TK_Reactor";

      // ---------------------------------------------------------------
      // Dados / metadados do domínio (Providers, Events, Conditions, Actions)
      // ---------------------------------------------------------------

      const PROVIDERS_META = {
        keyboard: {
          name: "Keyboard",
          description: "Eventos relacionados à digitação",
          icon: "keyboard"
        },
        app: {
          name: "App",
          description: "Eventos relacionados aos aplicativos",
          icon: "app"
        },
        clipboard: {
          name: "Clipboard",
          description: "Monitoramento da área de transferência",
          icon: "clipboard"
        },
        notification: {
          name: "Notification",
          description: "Eventos de notificações",
          icon: "bell"
        },
        screen: {
          name: "Screen",
          description: "Monitoramento de texto na tela via Acessibilidade",
          icon: "eye"
        }
      };

      const EVENTS_META = {
        typed_text: { label: "Texto digitado", provider: "keyboard" },
        app_opened: { label: "Aplicativo aberto", provider: "app" },
        clipboard_changed: {
          label: "Clipboard alterado",
          provider: "clipboard"
        },
        notification_received: {
          label: "Notificação recebida",
          provider: "notification"
        },
        screen_text_detected: {
          label: "Texto apareceu na tela",
          provider: "screen"
        }
      };

      const PROVIDER_EVENTS = {};
      Object.keys(EVENTS_META).forEach(type => {
        const providerId = EVENTS_META[type].provider;
        if (!PROVIDER_EVENTS[providerId]) PROVIDER_EVENTS[providerId] = [];
        PROVIDER_EVENTS[providerId].push(type);
      });

      const CONDITION_OPERATORS = {
        match: "Igual a",
        contains: "Contém",
        starts_with: "Começa com",
        ends_with: "Termina com",
        regex: "Regex"
      };

      // Eventos cuja lista de operadores de condição é restrita.
      // Texto Digitado só aceita "Termina com": é o único operador que faz
      // sentido para um gatilho no fim de um campo que está sendo digitado
      // em tempo real (não dá pra saber se o texto "contém" ou "é igual",
      // já que ele ainda está sendo digitado).
      const EVENT_ALLOWED_OPERATORS = {
        typed_text: ["ends_with"]
      };

      // Eventos para os quais a regra é travada em exatamente 1 condição
      // "Termina com" (não dá pra adicionar/remover condições).
      const SINGLE_ENDS_WITH_EVENTS = ["typed_text"];

      function allowedOperatorsForEvent(eventType) {
        return (
          EVENT_ALLOWED_OPERATORS[eventType] || Object.keys(CONDITION_OPERATORS)
        );
      }

      function isSingleEndsWithEvent(eventType) {
        return SINGLE_ENDS_WITH_EVENTS.indexOf(eventType) !== -1;
      }

      const ACTION_TYPES_META = {
        text_replacer: { label: "Text Replacer", events: ["typed_text"] },
        run_task: { label: "Executar Tarefa" },
        open_app: { label: "Abrir App" },
        ai: { label: "Processar com IA", events: ["typed_text"] },
        translate: { label: "Traduzir", events: ["typed_text"] },
        search: { label: "Pesquisar" },
        open_url: { label: "Abrir URL" },
        clipboard: { label: "Definir Clipboard" },
        notification: { label: "Criar Notificação" },
        click: { label: "Clicar na Tela" }
      };

      function allowedActionTypesForEvent(eventType) {
        return Object.keys(ACTION_TYPES_META).filter(type => {
          const meta = ACTION_TYPES_META[type];
          return !meta.events || meta.events.indexOf(eventType) !== -1;
        });
      }

      function actionApplicableToEvent(type, eventType) {
        const meta = ACTION_TYPES_META[type];
        if (!meta) return false;
        return !meta.events || meta.events.indexOf(eventType) !== -1;
      }

      const SEARCH_ENGINES = [
        ["google", "Google"],
        ["bing", "Bing"],
        ["duckduckgo", "DuckDuckGo"],
        ["youtube", "YouTube"]
      ];

      const LANG_OPTIONS = [
        ["en", "Inglês"],
        ["es", "Espanhol"],
        ["fr", "Francês"],
        ["de", "Alemão"],
        ["it", "Italiano"],
        ["pt", "Português"]
      ];

      const GEMINI_MODEL_OPTIONS = [
        ["gemini-2.5-flash", "Gemini 2.5 Flash"],
        ["gemini-2.5-pro", "Gemini 2.5 Pro"],
        ["gemini-2.0-flash", "Gemini 2.0 Flash"]
      ];

      const ICONS = {
        edit: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
        trash:
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
        plus: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
        close:
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
        copy: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v1"/></svg>',
        up: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
        down: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5v14M5 12l7 7 7-7"/></svg>',
        keyboard:
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M6 14h12"/></svg>',
        app: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>',
        clipboard:
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="6" y="4" width="12" height="17" rx="2"/><path d="M9 4V3a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v1"/><path d="M9 11h6M9 15h6"/></svg>',
        bell: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M10.3 21a1.9 1.9 0 0 0 3.4 0"/></svg>',
        eye: '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>'
      };

      const DEFAULT_CONFIG = {
        providers: {
          keyboard: { enabled: true },
          app: { enabled: true },
          clipboard: { enabled: true },
          notification: { enabled: false },
          screen: { enabled: false }
        },
        rules: [
          {
            id: "rule_seed1",
            enabled: true,
            name: "Resposta rápida Pix",
            provider: "keyboard",
            event: { type: "typed_text" },
            conditions: [{ operator: "ends_with", value: "@pix" }],
            actions: [
              {
                type: "text_replacer",
                config: { text: "Chave PIX: 123.456.789-00" }
              }
            ]
          },
          {
            id: "rule_seed2",
            enabled: true,
            name: "Abrir link copiado",
            provider: "clipboard",
            event: { type: "clipboard_changed" },
            conditions: [{ operator: "regex", value: "^https?://" }],
            actions: [
              { type: "run_task", config: { task: "TK_OpenClipboardLink" } }
            ]
          },
          {
            id: "rule_seed3",
            enabled: false,
            name: "Alerta de promoção",
            provider: "notification",
            event: { type: "notification_received" },
            conditions: [{ operator: "contains", value: "promoção" }],
            actions: [
              { type: "run_task", config: { task: "TK_DismissNotification" } }
            ]
          }
        ],
        settings: {
          theme: "dark",
          language: "pt",
          gemini: { model: "gemini-2.5-flash", apiKey: "" }
        }
      };

      // Providers que já existem na interface mas ainda não têm
      // implementação correspondente no monitor (act4 da TK_Reactor).
      // Enquanto isso, eles nunca podem ficar habilitados de verdade.
      const UNIMPLEMENTED_PROVIDERS = ["clipboard", "screen"];

      function isUnimplementedProvider(providerId) {
        return UNIMPLEMENTED_PROVIDERS.indexOf(providerId) !== -1;
      }

      // Normaliza qualquer config vinda de fora (arquivo salvo no Tasker,
      // import de backup, etc.) para o schema atual: garante que todo
      // provider de PROVIDERS_META exista em `providers`, força os ainda
      // não implementados para enabled:false e preenche rules/settings
      // ausentes. Evita o crash de "Cannot set properties of undefined"
      // quando o config salvo é mais antigo/incompleto que o app atual.
      function normalizeConfig(config) {
        const normalized = deepClone(config || {});
        if (!normalized.providers || typeof normalized.providers !== "object") {
          normalized.providers = {};
        }
        Object.keys(PROVIDERS_META).forEach(id => {
          if (
            !normalized.providers[id] ||
            typeof normalized.providers[id] !== "object"
          ) {
            normalized.providers[id] = { enabled: false };
          }
          if (isUnimplementedProvider(id)) {
            normalized.providers[id].enabled = false;
          }
        });
        if (!Array.isArray(normalized.rules)) normalized.rules = [];
        if (!normalized.settings || typeof normalized.settings !== "object") {
          normalized.settings = deepClone(DEFAULT_CONFIG.settings);
        }
        return normalized;
      }

      // ---------------------------------------------------------------
      // Helpers genéricos
      // ---------------------------------------------------------------

      function safeParseJSON(text) {
        try {
          return JSON.parse(text);
        } catch (error) {
          return null;
        }
      }

      function deepClone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function iconButton(className, iconName, title) {
        const btn = document.createElement("button");
        btn.className = className;
        btn.title = title;
        btn.innerHTML = ICONS[iconName];
        return btn;
      }

      function countLabel(count, singular, plural) {
        return `${count} ${count === 1 ? singular : plural}`;
      }

      function defaultActionConfig(type) {
        switch (type) {
          case "text_replacer":
            return { text: "" };
          case "run_task":
            return { task: "", par1: "", par2: "" };
          case "open_app":
            return { package: "" };
          case "ai":
            return { systemInstructions: "" };
          case "translate":
            return { language: "en" };
          case "search":
            return { engine: "google" };
          case "open_url":
            return { url: "" };
          case "clipboard":
            return { text: "" };
          case "notification":
            return { title: "", body: "" };
          case "click":
            return { x: 0, y: 0 };
          default:
            return {};
        }
      }

      function emptyRule() {
        return {
          id: null,
          enabled: true,
          name: "",
          provider: "keyboard",
          event: { type: "typed_text" },
          conditions: [],
          actions: []
        };
      }

      // ---------------------------------------------------------------
      // Ambientes de execução (Tasker real / simulação no navegador)
      // ---------------------------------------------------------------

      function createTaskerEnvironment() {
        function isAvailable() {
          return typeof Tasker !== "undefined";
        }

        // Export não depende mais da task: usa a ponte nativa do Scenes V2
        // (Tasker.createDirectory / Tasker.writeFile) direto no JS, sem
        // round-trip pra TK_Reactor. As outras ações (get_status,
        // toggle_monitor, save_config) continuam indo pela task porque
        // dependem de estado Java (reactorConfig / stopReactorMonitor) que
        // só existe no lado do monitor, sem equivalente na ponte genérica.
        async function exportConfigDirect(config) {
          try {
            const dir = "/storage/emulated/0/Download";
            await Tasker.createDirectory({ dir, createParents: true });
            const fileName = `reactor-backup-${Date.now()}.json`;
            await Tasker.writeFile({
              path: `${dir}/${fileName}`,
              text: JSON.stringify(config, null, 2),
              append: false
            });
            return {
              ok: true,
              message: `Exportado para Download/${fileName}`
            };
          } catch (error) {
            return {
              ok: false,
              error: `Falha ao exportar: ${error.message}`
            };
          }
        }

        async function runAction(action, payload) {
          if (action === "export_config") {
            return exportConfigDirect((payload || {}).config);
          }

          const variables = {
            par1: action,
            par2: JSON.stringify(payload || {})
          };
          let raw = null;
          try {
            const result = await Tasker.runTaskForResult({
              name: TASK_NAME,
              variables
            });
            raw = result ? result.returnValue : null;
          } catch (error) {
            return {
              ok: false,
              error: `Falha ao chamar ${TASK_NAME}: ${error.message}`
            };
          }
          if (!raw) {
            return {
              ok: false,
              error: `Sem resposta da tarefa ${TASK_NAME}. Verifique se ela existe no Tasker.`
            };
          }
          const parsed = safeParseJSON(raw);
          return (
            parsed || {
              ok: false,
              error: "Resposta inválida da tarefa (JSON malformado)."
            }
          );
        }

        return { isAvailable, runAction };
      }

      function createWebEnvironment() {
        // Simulação mínima do "backend" Tasker: só persiste o que o app
        // (fonte única da lógica de CRUD) manda salvar. Não conhece regras
        // de negócio — só guarda/retorna config e alterna o monitor.
        let store = null;
        let monitorActive = false;

        async function runAction(action, payload) {
          payload = payload || {};
          switch (action) {
            case "get_status":
              return {
                ok: true,
                monitorActive,
                config: store ? deepClone(store) : null
              };

            case "toggle_monitor":
              monitorActive = !monitorActive;
              return {
                ok: true,
                monitorActive,
                message: monitorActive ? "Monitor iniciado" : "Monitor parado"
              };

            case "save_config":
              store = deepClone(payload.config);
              return {
                ok: true,
                monitorActive,
                needsRestart: !!payload.providersChanged && monitorActive,
                message: "Configuração salva"
              };

            case "export_config":
              try {
                const blob = new Blob(
                  [JSON.stringify(payload.config, null, 2)],
                  { type: "application/json" }
                );
                const url = URL.createObjectURL(blob);
                const link = document.createElement("a");
                link.href = url;
                link.download = "reactor.json";
                document.body.appendChild(link);
                link.click();
                link.remove();
                setTimeout(() => URL.revokeObjectURL(url), 1000);
                return {
                  ok: true,
                  monitorActive,
                  message: "Configuração exportada"
                };
              } catch (error) {
                return {
                  ok: false,
                  error: `Falha ao exportar: ${error.message}`
                };
              }

            default:
              return { ok: false, error: `Ação desconhecida: ${action}` };
          }
        }

        return { isAvailable: () => true, runAction };
      }

      function selectEnvironment() {
        const taskerEnvironment = createTaskerEnvironment();
        return taskerEnvironment.isAvailable()
          ? taskerEnvironment
          : createWebEnvironment();
      }

      const environment = selectEnvironment();

      // ---------------------------------------------------------------
      // Estado da aplicação / ponte com o ambiente
      // ---------------------------------------------------------------

      const appState = {
        monitorActive: false,
        restarting: false,
        config: {
          providers: {},
          rules: [],
          settings: {
            theme: "dark",
            language: "pt",
            gemini: { model: "gemini-2.5-flash", apiKey: "" }
          }
        },
        activeTab: null
      };

      // Geração de ID e comparação de providers: usadas por qualquer
      // mutação de config, em qualquer ambiente (Tasker ou navegador).
      function genId() {
        return `rule_${Date.now().toString(36)}${Math.random()
          .toString(36)
          .slice(2, 6)}`;
      }

      function cloneProviders(providers) {
        return deepClone(providers || {});
      }

      function providersEqual(a, b) {
        return JSON.stringify(a) === JSON.stringify(b);
      }

      // Para ações que não mexem na config (ligar/desligar monitor, ler
      // status, exportar).
      async function performAction(action, payload) {
        setLoadingVisible(true);
        const response = await environment.runAction(action, payload || {});
        if (typeof response.monitorActive === "boolean") {
          appState.monitorActive = response.monitorActive;
        }
        renderApp();
        setLoadingVisible(false);

        const feedback = response.error || response.message;
        if (feedback) showToast(feedback, response.ok === false);

        return response;
      }

      // Desliga e liga o monitor em sequência. Usado automaticamente pela
      // performConfigMutation quando salvar muda o conjunto de providers
      // ativos com o monitor já rodando (ver needsRestart) — antes disso
      // pedia confirmação num banner; agora reinicia sozinho, na hora.
      //
      // Enquanto a sequência roda, appState.restarting fica true e
      // renderMasterPower/renderDashboardPage mostram "Reiniciando..." fixo
      // — sem isso, os dois toggle_monitor internos fariam o estado piscar
      // PARADO → ATIVO no meio do processo, antes de estabilizar.
      async function restartMonitor() {
        appState.restarting = true;
        renderApp();
        setLoadingVisible(true);

        await toggleMonitorQuiet();
        await sleep(400);
        await toggleMonitorQuiet();

        setLoadingVisible(false);
        appState.restarting = false;
        renderApp();
        showToast("Monitor reiniciado", false);
      }

      // Liga/desliga o monitor sem os efeitos colaterais de performAction
      // (loading individual + toast por chamada). Usado só internamente
      // por restartMonitor, que já cuida de loading/feedback para a
      // sequência inteira em vez de por toggle.
      async function toggleMonitorQuiet() {
        const response = await environment.runAction("toggle_monitor", {});
        if (typeof response.monitorActive === "boolean") {
          appState.monitorActive = response.monitorActive;
        }
        if (response.error) {
          showToast(response.error, true);
        }
        return response;
      }

      // Única porta de entrada para qualquer alteração de regras,
      // providers ou configurações. `mutateFn` mexe diretamente em
      // `appState.config` (toda a lógica de criar/editar/excluir/duplicar
      // fica aqui no JS); depois disso, o resultado inteiro é enviado de
      // uma vez para o ambiente persistir (arquivo + variável do monitor,
      // no Tasker; memória, no navegador). Se `mutateFn` lançar um erro
      // (validação), nada é enviado ao ambiente.
      async function performConfigMutation(mutateFn, successMessage) {
        const beforeProviders = cloneProviders(appState.config.providers);
        const backup = deepClone(appState.config);

        try {
          mutateFn();
        } catch (error) {
          showToast(error.message, true);
          // Sem isso, o app não re-renderiza após uma mutação que falhou,
          // e controles nativos (como o <input type="checkbox">) podem
          // ficar com o estado visual dessincronizado do appState real.
          renderApp();
          return { ok: false, error: error.message };
        }

        setLoadingVisible(true);
        const providersChanged = !providersEqual(
          beforeProviders,
          appState.config.providers
        );
        const response = await environment.runAction("save_config", {
          config: appState.config,
          providersChanged
        });

        if (response.ok === false) {
          appState.config = backup;
        }
        if (typeof response.monitorActive === "boolean") {
          appState.monitorActive = response.monitorActive;
        }
        renderApp();
        setLoadingVisible(false);

        const feedback =
          response.error ||
          response.message ||
          (response.ok !== false ? successMessage : null);
        if (feedback) showToast(feedback, response.ok === false);
        if (response.needsRestart) {
          await restartMonitor();
        }

        return response;
      }

      let toastTimer = null;
      function showToast(message, isError) {
        const box = document.getElementById("toast");
        const msg = document.getElementById("toastMsg");
        const label = document.getElementById("toastText");
        label.textContent = message;
        msg.className = `msg ${isError ? "err" : "ok"}`;
        box.style.display = "flex";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          box.style.display = "none";
        }, 3200);
      }

      function setLoadingVisible(visible) {
        document.getElementById("loading").style.display = visible
          ? "flex"
          : "none";
      }

      function applyTheme(theme) {
        const value = theme === "light" ? "light" : "dark";
        document.documentElement.setAttribute("data-theme", value);
        document.documentElement.style.colorScheme = value;
      }

      // ---------------------------------------------------------------
      // Navegação / renderização geral
      // ---------------------------------------------------------------

      const PAGES = [
        { id: "dashboard", label: "Painel", render: renderDashboardPage },
        { id: "rules", label: "Regras", render: renderRulesPage },
        { id: "providers", label: "Providers", render: renderProvidersPage },
        { id: "settings", label: "Config", render: renderSettingsPage }
      ];

      function ensureActiveTab() {
        if (!appState.activeTab) appState.activeTab = "dashboard";
      }

      function renderApp() {
        ensureActiveTab();
        applyTheme(
          (appState.config.settings && appState.config.settings.theme) || "dark"
        );
        renderMasterPower();
        renderTabs();
        renderPage();
      }

      function renderMasterPower() {
        const switchInput = document.getElementById("masterSwitch");
        const led = document.getElementById("masterLed");
        const stateLabel = document.getElementById("masterState");

        switchInput.disabled = appState.restarting;

        if (appState.restarting) {
          led.className = "led restarting";
          stateLabel.textContent = "REINICIANDO...";
          return;
        }

        switchInput.checked = appState.monitorActive;
        led.className = `led ${appState.monitorActive ? "on" : "off"}`;
        stateLabel.textContent = appState.monitorActive ? "ATIVO" : "PARADO";
      }

      function renderTabs() {
        const bar = document.getElementById("tabBar");
        bar.innerHTML = "";
        PAGES.forEach(page => {
          const tab = el(
            "button",
            `tab${page.id === appState.activeTab ? " active" : ""}`,
            page.label
          );
          tab.addEventListener("click", () => {
            appState.activeTab = page.id;
            renderApp();
          });
          bar.appendChild(tab);
        });
      }

      function renderPage() {
        const current =
          PAGES.find(p => p.id === appState.activeTab) || PAGES[0];
        current.render();
      }

      function sectionLabel(number, text) {
        const label = el("div", "editor-section-label");
        if (number != null) label.appendChild(el("span", "n", `${number}·`));
        label.appendChild(document.createTextNode(text));
        return label;
      }

      // ---------------------------------------------------------------
      // Página: Painel (Dashboard)
      // ---------------------------------------------------------------

      function statCard(value, label) {
        const card = el("div", "stat-card");
        card.appendChild(el("div", "stat-value", value));
        card.appendChild(el("div", "stat-label", label));
        return card;
      }

      function renderFlowDiagram() {
        const wrap = el("div", "flow-diagram");
        wrap.appendChild(el("div", "section-label", "Fluxo de execução"));
        const track = el(
          "div",
          `flow-track${
            appState.restarting || appState.monitorActive ? " live" : ""
          }`
        );
        const steps = ["Provider", "Evento", "Condições", "Ações"];
        steps.forEach((label, index) => {
          track.appendChild(el("div", "flow-node", label));
          if (index < steps.length - 1) {
            track.appendChild(el("div", "flow-arrow", "›"));
          }
        });
        wrap.appendChild(track);
        return wrap;
      }

      function renderDashboardPage() {
        const page = document.getElementById("page");
        page.innerHTML = "";

        const rules = appState.config.rules || [];
        const activeRules = rules.filter(r => r.enabled).length;
        const providers = appState.config.providers || {};
        const providerIds = Object.keys(PROVIDERS_META);
        const activeProviders = providerIds.filter(
          id => providers[id] && providers[id].enabled
        ).length;

        const head = el("div", "page-head");
        head.appendChild(el("h2", null, "Painel"));
        page.appendChild(head);

        const grid = el("div", "stat-grid");
        grid.appendChild(statCard(String(rules.length), "Regras cadastradas"));
        grid.appendChild(statCard(String(activeRules), "Regras ativas"));
        grid.appendChild(
          statCard(
            `${activeProviders}/${providerIds.length}`,
            "Providers ativos"
          )
        );
        grid.appendChild(
          statCard(
            appState.restarting
              ? "Reiniciando"
              : appState.monitorActive
              ? "Ligado"
              : "Desligado",
            "Monitor"
          )
        );
        page.appendChild(grid);

        page.appendChild(renderFlowDiagram());

        const label = el("div", "power-card-label");
        label.appendChild(
          el(
            "b",
            null,
            appState.restarting
              ? "Reiniciando monitor"
              : appState.monitorActive
              ? "Monitor ativo"
              : "Monitor parado"
          )
        );
        label.appendChild(
          el(
            "span",
            null,
            appState.restarting
              ? "Aplicando mudança de providers…"
              : appState.monitorActive
              ? "Reagindo a eventos em tempo real."
              : "Nenhum evento está sendo observado."
          )
        );
        powerCard.appendChild(label);
        const bigBtn = el(
          "button",
          `power-toggle-btn${
            !appState.restarting && appState.monitorActive ? " on" : ""
          }${appState.restarting ? " restarting" : ""}`,
          appState.restarting
            ? "Reiniciando..."
            : appState.monitorActive
            ? "Parar"
            : "Iniciar"
        );
        bigBtn.disabled = appState.restarting;
        bigBtn.addEventListener("click", () => {
          if (appState.restarting) return;
          performAction("toggle_monitor", {});
        });
        powerCard.appendChild(bigBtn);
        page.appendChild(powerCard);

      // ---------------------------------------------------------------
      // Página: Regras
      // ---------------------------------------------------------------

      function providerBadge(providerId) {
        const meta = PROVIDERS_META[providerId];
        const badge = el("span", "provider-badge");
        badge.innerHTML = ICONS[meta.icon] || "";
        badge.appendChild(document.createTextNode(meta.name));
        return badge;
      }

      function renderRuleRow(rule) {
        const row = el("div", `rule-row${rule.enabled ? "" : " off"}`);

        const dot = el("span", "rule-dot");
        dot.title = "Ativar/Desativar";
        dot.addEventListener("click", () => {
          performConfigMutation(() => {
            const target = appState.config.rules.find(r => r.id === rule.id);
            if (!target) throw new Error("Regra não encontrada");
            target.enabled = !target.enabled;
          }, "Regra atualizada");
        });
        row.appendChild(dot);

        const info = el("div", "rule-info");
        const top = el("div", "rule-top");
        top.appendChild(el("span", "rule-name", rule.name));
        top.appendChild(providerBadge(rule.provider));
        info.appendChild(top);

        const eventMeta = EVENTS_META[rule.event.type];
        const flow = el("div", "rule-flow");
        flow.appendChild(
          el("span", "flow-part", eventMeta ? eventMeta.label : rule.event.type)
        );
        flow.appendChild(el("span", "flow-sep", "›"));
        flow.appendChild(
          el(
            "span",
            "flow-part",
            countLabel(rule.conditions.length, "condição", "condições")
          )
        );
        flow.appendChild(el("span", "flow-sep", "›"));
        flow.appendChild(
          el(
            "span",
            "flow-part",
            countLabel(rule.actions.length, "ação", "ações")
          )
        );
        info.appendChild(flow);
        row.appendChild(info);

        const actions = el("div", "rule-actions");
        const editBtn = iconButton("icon-btn", "edit", "Editar");
        editBtn.addEventListener("click", () => openRuleDialog(rule));
        const dupBtn = iconButton("icon-btn", "copy", "Duplicar");
        dupBtn.addEventListener("click", () =>
          performConfigMutation(() => {
            const idx = appState.config.rules.findIndex(r => r.id === rule.id);
            if (idx === -1) throw new Error("Regra não encontrada");
            const clone = deepClone(appState.config.rules[idx]);
            clone.id = genId();
            clone.name = `${clone.name} (cópia)`;
            appState.config.rules.splice(idx + 1, 0, clone);
          }, "Regra duplicada")
        );
        const delBtn = iconButton("icon-btn danger", "trash", "Excluir");
        delBtn.addEventListener("click", () =>
          performConfigMutation(() => {
            appState.config.rules = appState.config.rules.filter(
              r => r.id !== rule.id
            );
          }, "Regra excluída")
        );
        actions.appendChild(editBtn);
        actions.appendChild(dupBtn);
        actions.appendChild(delBtn);
        row.appendChild(actions);

        return row;
      }

      function renderRulesPage() {
        const page = document.getElementById("page");
        page.innerHTML = "";
        const rules = appState.config.rules || [];
        const activeCount = rules.filter(r => r.enabled).length;

        const head = el("div", "page-head");
        const top = el("div", "page-head-top");
        top.appendChild(el("h2", null, "Regras"));
        const headActions = el("div", "page-head-actions");
        const addBtn = document.createElement("button");
        addBtn.className = "btn-header-add";
        addBtn.innerHTML = `${ICONS.plus}<span>Nova Regra</span>`;
        addBtn.addEventListener("click", () => openRuleDialog(null));
        headActions.appendChild(addBtn);
        top.appendChild(headActions);
        head.appendChild(top);

        const stats = el("div", "page-stats");
        const statsInfo = el("div", "page-stats-info");
        statsInfo.appendChild(
          el(
            "span",
            "count",
            `${countLabel(rules.length, "regra", "regras")} · ${countLabel(
              activeCount,
              "ativa",
              "ativas"
            )}`
          )
        );
        stats.appendChild(statsInfo);
        head.appendChild(stats);
        page.appendChild(head);

        const section = el("div", "section");
        if (rules.length === 0) {
          section.appendChild(
            el("div", "empty-hint", "Nenhuma regra cadastrada ainda.")
          );
        } else {

          rules.forEach(rule => list.appendChild(renderRuleRow(rule)));
          section.appendChild(list);
