<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
    />
    <meta name="color-scheme" content="dark" />
    <script src="https://cdn.jsdelivr.net/npm/eruda"></script>
    <script>
      eruda.init();
    </script>
    <title>Reactor</title>
    <style>
      :root {
        --bg: #0b0d12;
        --surface: #12151c;
        --surface-2: #171b24;
        --surface-3: #1e2330;
        --border: #232838;
        --border-soft: #1a1e28;
        --text: #e7e9ee;
        --text-dim: #8b93a6;
        --text-faint: #545c6e;
        --accent: #e8a33d;
        --accent-dim: #6b4e22;
        --accent-soft: rgba(232, 163, 61, 0.12);
        --ok: #4fbf82;
        --danger: #e2584a;
        --mono:
          ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono",
          monospace;
        --sans: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        padding: 0;
        background: var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-tap-highlight-color: transparent;
      }
      body {
        padding-bottom: 90px;
      }
      button {
        font-family: inherit;
        cursor: pointer;
        border: 0;
        background: none;
        color: inherit;
        -webkit-tap-highlight-color: transparent;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        overflow: hidden;
        background: linear-gradient(
          180deg,
          var(--surface-2) 0%,
          var(--bg) 100%
        );
        border-bottom: 1px solid var(--border);
        padding: 18px 16px 14px;
      }
      header::before {
        content: "";
        position: absolute;
        inset: 0;
        opacity: 0.05;
        background-image:
          linear-gradient(var(--text-faint) 1px, transparent 1px),
          linear-gradient(90deg, var(--text-faint) 1px, transparent 1px);
        background-size: 22px 22px;
        pointer-events: none;
      }
      .header-inner {
        position: relative;
        z-index: 1;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .brand-mark {
        color: var(--accent);
        display: flex;
        flex-shrink: 0;
      }
      .brand-word {
        font-family: var(--mono);
        font-size: 19px;
        font-weight: 700;
        letter-spacing: 0.09em;
      }
      .tagline {
        font-size: 12px;
        color: var(--text-dim);
        margin: 6px 0 0;
        line-height: 1.45;
        max-width: 38ch;
      }

      .power {
        display: flex;
        align-items: center;
        gap: 10px;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 11px 14px;
        margin-top: 14px;
      }
      .led {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--text-faint);
        flex-shrink: 0;
        transition: background 0.2s;
      }
      .led.on {
        background: var(--ok);
        box-shadow: 0 0 8px 1px rgba(79, 191, 130, 0.55);
        animation: ledPulse 2.4s ease-in-out infinite;
      }
      .led.off {
        background: var(--danger);
        box-shadow: 0 0 8px 1px rgba(226, 88, 74, 0.3);
      }
      @keyframes ledPulse {
        0%,
        100% {
          box-shadow: 0 0 8px 1px rgba(79, 191, 130, 0.5);
        }
        50% {
          box-shadow: 0 0 13px 3px rgba(79, 191, 130, 0.75);
        }
      }
      .power-info {
        flex: 1;
        min-width: 0;
      }
      .power-info b {
        display: block;
        font-size: 13.5px;
        font-weight: 600;
      }
      .power-info span {
        font-size: 11px;
        color: var(--text-dim);
        font-family: var(--mono);
        letter-spacing: 0.03em;
      }

      .switch {
        position: relative;
        width: 46px;
        height: 26px;
        flex-shrink: 0;
      }
      .switch.sm {
        width: 38px;
        height: 22px;
      }
      .switch input {
        position: absolute;
        opacity: 0;
        inset: 0;
        margin: 0;
        cursor: pointer;
        z-index: 2;
      }
      .switch .track {
        position: absolute;
        inset: 0;
        background: #242a38;
        border-radius: 14px;
        border: 1px solid var(--border);
        transition: background 0.18s;
      }
      .switch .knob {
        position: absolute;
        top: 2px;
        left: 2px;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: #7a8194;
        transition:
          transform 0.18s,
          background 0.18s;
      }
      .switch.sm .knob {
        width: 16px;
        height: 16px;
      }
      .switch input:checked + .track {
        background: var(--accent-dim);
      }
      .switch input:checked + .track + .knob {
        transform: translateX(20px);
        background: var(--accent);
      }
      .switch.sm input:checked + .track + .knob {
        transform: translateX(16px);
      }

      #banner {
        display: none;
        margin: 12px 16px 0;
        background: var(--accent-soft);
        border: 1px solid var(--accent-dim);
        border-radius: 10px;
        padding: 10px 12px;
        font-size: 12.5px;
        color: var(--text-dim);
        align-items: center;
        gap: 10px;
      }
      #banner button {
        background: var(--accent);
        color: #1a1408;
        font-family: var(--mono);
        font-weight: 700;
        font-size: 11.5px;
        padding: 6px 10px;
        border-radius: 7px;
        flex-shrink: 0;
      }

      .tabs {
        display: flex;
        gap: 6px;
        margin: 14px 16px 4px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 4px;
      }
      .tab {
        flex: 1;
        padding: 9px 10px;
        border-radius: 9px;
        font-size: 12.5px;
        font-weight: 600;
        color: var(--text-dim);
        transition:
          background 0.15s,
          color 0.15s;
      }
      .tab.active {
        background: var(--surface-3);
        color: var(--text);
        box-shadow: inset 0 -2px 0 var(--accent);
      }

      main {
        padding: 4px 16px 0;
      }

      .page-head {
        margin: 16px 2px 16px;
      }
      .page-head-top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
      }
      .page-head-top h2 {
        font-family: var(--mono);
        font-size: 16px;
        font-weight: 600;
        letter-spacing: -0.01em;
        margin: 0;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .page-head-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      .btn-header-add {
        display: flex;
        align-items: center;
        gap: 5px;
        padding: 6px 10px;
        border: 1px solid var(--accent-dim);
        border-radius: 8px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 11.5px;
        font-weight: 700;
        flex-shrink: 0;
      }
      .btn-header-add:active {
        background: var(--accent-dim);
        color: #1a1408;
      }
      .page-stats {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-top: 10px;
        padding: 9px 9px 9px 12px;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 10px;
      }
      .page-stats-info {
        display: flex;
        align-items: center;
        gap: 8px;
        min-width: 0;
        font-family: var(--mono);
        font-size: 11.5px;
        color: var(--text-dim);
      }
      .page-stats-info .count {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .chip {
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.06em;
        padding: 2px 7px;
        border-radius: 20px;
        border: 1px solid;
        font-family: var(--sans);
        font-weight: 700;
      }
      .chip.ok {
        color: var(--ok);
        border-color: rgba(79, 191, 130, 0.35);
        background: rgba(79, 191, 130, 0.08);
      }

      .section-label {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.1em;
        color: var(--text-faint);
        text-transform: uppercase;
        margin: 0 2px 8px;
      }

      .field-row {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 12px;
      }
      .field-row label {
        font-size: 11.5px;
        color: var(--text-dim);
        width: 84px;
        flex-shrink: 0;
      }
      .field-row input[type="text"] {
        flex: 1;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 8px 10px;
        font-size: 13px;
        font-family: var(--mono);
        min-width: 0;
      }
      .field-row input[type="checkbox"] {
        width: 18px;
        height: 18px;
        accent-color: var(--accent);
      }
      .field-block {
        margin-bottom: 12px;
      }
      .field-block .block-label {
        display: block;
        font-size: 11.5px;
        color: var(--text-dim);
        margin-bottom: 5px;
      }
      .save-line {
        display: flex;
        justify-content: flex-end;
        margin-top: 4px;
        padding-bottom: 14px;
      }
      .btn {
        font-family: var(--sans);
        font-size: 12.5px;
        font-weight: 600;
        border-radius: 8px;
        padding: 8px 14px;
      }
      .btn-accent {
        background: var(--accent);
        color: #1a1408;
      }
      .btn-ghost {
        border: 1px solid var(--border);
        color: var(--text-dim);
      }

      .section {
        margin-bottom: 20px;
      }
      .trigger-list {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 14px;
        overflow: hidden;
      }
      .trigger-row {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        padding: 12px;
        border-bottom: 1px solid var(--border-soft);
      }
      .trigger-row:last-child {
        border-bottom: none;
      }
      .trigger-row.off {
        opacity: 0.5;
      }
      .trigger-dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
        background: var(--ok);
        margin-top: 5px;
        flex-shrink: 0;
        cursor: pointer;
      }
      .trigger-row.off .trigger-dot {
        background: var(--text-faint);
      }
      .trigger-info {
        flex: 1;
        min-width: 0;
      }
      .trigger-top {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .trigger-token {
        font-family: var(--mono);
        font-size: 13.5px;
        font-weight: 600;
      }
      .trigger-kind {
        font-family: var(--mono);
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        color: var(--text-faint);
        flex-shrink: 0;
      }
      .trigger-value {
        margin-top: 3px;
        font-size: 12px;
        color: var(--text-dim);
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
        word-break: break-word;
      }
      .trigger-actions {
        display: flex;
        gap: 5px;
        flex-shrink: 0;
      }
      .icon-btn {
        width: 28px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text-dim);
        flex-shrink: 0;
      }
      .icon-btn.danger:active {
        color: var(--danger);
        border-color: rgba(226, 88, 74, 0.4);
      }

      .empty-hint {
        font-size: 12px;
        color: var(--text-faint);
        font-style: italic;
        padding: 4px 2px;
      }

      select,
      textarea {
        width: 100%;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 8px;
        color: var(--text);
        padding: 8px 10px;
        font-size: 13px;
        font-family: var(--sans);
      }
      textarea {
        min-height: 56px;
        resize: vertical;
      }
      .hint {
        font-size: 10.5px;
        color: var(--text-faint);
        margin-top: 2px;
      }

      .dialog-overlay {
        position: fixed;
        inset: 0;
        z-index: 60;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        background: rgba(6, 7, 10, 0.6);
        backdrop-filter: blur(8px);
        -webkit-backdrop-filter: blur(8px);
        animation: overlayIn 0.16s ease-out;
      }
      .dialog {
        width: min(420px, 100%);
        max-height: 84vh;
        overflow-y: auto;
        background: var(--surface-2);
        border: 1px solid var(--border);
        border-radius: 16px;
        padding: 18px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        animation: dialogIn 0.16s ease-out;
      }
      @keyframes overlayIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }
      @keyframes dialogIn {
        from {
          opacity: 0;
          transform: translateY(8px) scale(0.98);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .led.on,
        .dialog,
        .dialog-overlay,
        #toast .msg {
          animation: none;
        }
      }
      .dialog-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 14px;
        gap: 10px;
      }
      .dialog-head b {
        font-family: var(--mono);
        font-size: 15px;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dialog-close {
        width: 26px;
        height: 26px;
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--text-faint);
        border-radius: 7px;
        flex-shrink: 0;
      }
      .dialog-close:active {
        background: var(--surface-3);
      }
      .dialog-foot {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 16px;
      }

      #toast {
        position: fixed;
        left: 0;
        right: 0;
        bottom: max(20px, env(safe-area-inset-bottom, 0px) + 12px);
        z-index: 70;
        display: none;
        justify-content: center;
        padding: 0 16px;
        pointer-events: none;
      }
      #toast .msg {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        max-width: 100%;
        background: var(--surface-3);
        border: 1px solid var(--border);
        border-radius: 999px;
        padding: 10px 16px;
        font-size: 12.5px;
        font-weight: 500;
        color: var(--text);
        box-shadow: 0 10px 28px rgba(0, 0, 0, 0.45);
        pointer-events: auto;
        animation: toastIn 0.18s ease-out;
      }
      #toast .msg .toast-dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--text-faint);
        flex-shrink: 0;
      }
      #toast .msg .toast-text {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      #toast .msg.err .toast-dot {
        background: var(--danger);
        box-shadow: 0 0 6px 1px rgba(226, 88, 74, 0.5);
      }
      #toast .msg.ok .toast-dot {
        background: var(--ok);
        box-shadow: 0 0 6px 1px rgba(79, 191, 130, 0.5);
      }
      @keyframes toastIn {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }

      #loading {
        position: fixed;
        inset: 0;
        background: rgba(11, 13, 18, 0.6);
        z-index: 50;
        display: none;
        align-items: center;
        justify-content: center;
        font-family: var(--mono);
        font-size: 12px;
        color: var(--text-dim);
      }
    </style>
  </head>
  <body>
    <header>
      <div class="header-inner">
        <div class="brand">
          <span class="brand-mark">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="1.6"
            >
              <ellipse cx="12" cy="12" rx="10" ry="4.2"></ellipse>
              <ellipse
                cx="12"
                cy="12"
                rx="10"
                ry="4.2"
                transform="rotate(60 12 12)"
              ></ellipse>
              <ellipse
                cx="12"
                cy="12"
                rx="10"
                ry="4.2"
                transform="rotate(120 12 12)"
              ></ellipse>
              <circle
                cx="12"
                cy="12"
                r="1.6"
                fill="currentColor"
                stroke="none"
              ></circle>
            </svg>
          </span>
          <span class="brand-word">REACTOR</span>
        </div>
        <p class="tagline">Automação por acessibilidade, direto no Tasker.</p>
        <div class="power">
          <div class="led off" id="masterLed"></div>
          <div class="power-info">
            <b>Monitor de acessibilidade</b>
            <span id="masterState">PARADO</span>
          </div>
          <label class="switch">
            <input type="checkbox" id="masterSwitch" />
            <span class="track"></span>
            <span class="knob"></span>
          </label>
        </div>
      </div>
    </header>

    <div id="banner">
      <span
        >Alguns módulos foram alterados e precisam reiniciar o monitor para
        valer.</span
      >
      <button id="restartBtn">Reiniciar</button>
    </div>

    <nav class="tabs" id="tabBar"></nav>

    <main id="page"></main>

    <div id="toast">
      <div class="msg" id="toastMsg">
        <span class="toast-dot"></span>
        <span class="toast-text" id="toastText"></span>
      </div>
    </div>
    <div id="loading">executando…</div>

    <script>
      "use strict";

      const CONFIG_PATH =
        "/storage/emulated/0/Tasker/ModuleManager/modules.json";
      const TASK_NAME = "TK_ModuleManager";

      const TRIGGER_RULES = {
        expander: {
          pattern: /^@[a-z0-9_]+$/,
          hint: "minúsculo, sem espaço, começando com '@'  (ex: @pix)"
        },
        command: {
          pattern: /^[a-z0-9_-]+$/,
          hint: "minúsculo, sem espaço, sem ':'  (ex: flash)"
        }
      };

      const KIND_LABEL = {
        static: "texto",
        translate: "tradução",
        ai: "ia",
        youtube: "youtube"
      };

      const LANG_OPTIONS = [
        ["en", "Inglês"],
        ["es", "Espanhol"],
        ["fr", "Francês"],
        ["de", "Alemão"],
        ["it", "Italiano"],
        ["pt", "Português"]
      ];
      const LANG_LABELS = Object.fromEntries(LANG_OPTIONS);

      const ICONS = {
        edit: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>',
        trash:
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg>',
        plus: '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
        close:
          '<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>',
        settings:
          '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>'
      };

      const DEFAULT_CONFIG = {
        monitorEnabled: false,
        modules: {
          expander_default: {
            displayName: "Expansor de Texto",
            engine: "expander",
            enabled: true,
            config: {
              apiKey: "",
              model: "",
              systemInstructions: ""
            },
            triggers: {
              "pix:": {
                enabled: true,
                kind: "static",
                value: "Chave PIX: 123.456.789-00"
              },
              "mail:": {
                enabled: true,
                kind: "static",
                value: "john.smith@email.com"
              },
              "en:": { enabled: true, kind: "translate", lang: "en" },
              "es:": { enabled: true, kind: "translate", lang: "es" },
              "ia:": { enabled: true, kind: "ai", instruction: "" },
              "yt:": { enabled: true, kind: "youtube" }
            }
          },
          command_default: {
            displayName: "Executor de Comandos",
            engine: "command",
            enabled: true,
            config: {
              prefix: ">>",
              taskName: "TK_CommandRouter",
              restrictToKnown: false
            },
            triggers: {
              flash: { enabled: true, description: "Liga/desliga a lanterna" },
              wifi: { enabled: true, description: "Alterna o Wi-Fi" }
            }
          }
        }
      };

      function safeParseJSON(text) {
        try {
          return JSON.parse(text);
        } catch (error) {
          return null;
        }
      }

      function deepClone(value) {
        return JSON.parse(JSON.stringify(value));
      }

      function sleep(ms) {
        return new Promise(resolve => setTimeout(resolve, ms));
      }

      function el(tag, className, text) {
        const node = document.createElement(tag);
        if (className) node.className = className;
        if (text !== undefined) node.textContent = text;
        return node;
      }

      function iconButton(className, iconName, title) {
        const btn = document.createElement("button");
        btn.className = className;
        btn.title = title;
        btn.innerHTML = ICONS[iconName];
        return btn;
      }

      function createTaskerEnvironment() {
        function isAvailable() {
          return typeof Tasker !== "undefined";
        }

        async function readFileText(path) {
          try {
            const result = await Tasker.runShell({ cmd: `cat "${path}"` });
            const text =
              result && result.stdout ? String(result.stdout).trim() : "";
            return text.length > 0 ? text : null;
          } catch (error) {
            return null;
          }
        }

        async function readConfig() {
          const raw = await readFileText(CONFIG_PATH);
          return raw ? safeParseJSON(raw) : null;
        }

        async function runAction(action, payload) {
          const variables = {
            par1: action,
            par2: JSON.stringify(payload || {})
          };
          let raw = null;
          try {
            const result = await Tasker.runTaskForResult({
              name: TASK_NAME,
              variables
            });
            raw = result ? result.returnValue : null;
          } catch (error) {
            return {
              ok: false,
              error: `Falha ao chamar ${TASK_NAME}: ${error.message}`
            };
          }
          if (!raw) {
            return {
              ok: false,
              error: `Sem resposta da tarefa ${TASK_NAME}. Verifique se ela existe no Tasker.`
            };
          }
          const parsed = safeParseJSON(raw);
          return (
            parsed || {
              ok: false,
              error: "Resposta inválida da tarefa (JSON malformado)."
            }
          );
        }

        return { isAvailable, readConfig, runAction };
      }

      function createWebEnvironment(defaultConfig) {
        let store = null;
        let monitorActive = false;

        function ensureStore() {
          if (!store) store = deepClone(defaultConfig);
          return store;
        }

        function handleGetStatus(config) {
          const activeModuleIds = Object.keys(config.modules).filter(
            id => config.modules[id].enabled
          );
          return { ok: true, monitorActive, activeModuleIds, config };
        }

        function handleToggleMonitor() {
          monitorActive = !monitorActive;
          return {
            ok: true,
            monitorActive,
            message: monitorActive ? "Monitor iniciado" : "Monitor parado"
          };
        }

        function handleToggleModule(config, payload) {
          config.modules[payload.id].enabled = payload.enabled;
          return {
            ok: true,
            needsRestart: monitorActive,
            message: "Módulo atualizado"
          };
        }

        function handleUpdateModuleConfig(config, payload) {
          const module = config.modules[payload.moduleId];
          if (payload.displayName) module.displayName = payload.displayName;
          if (payload.config) module.config = payload.config;
          return {
            ok: true,
            needsRestart: false,
            message: "Configuração atualizada"
          };
        }

        function buildTriggerEntry(module, payload, previousEnabled) {
          const entry = {
            enabled: previousEnabled !== undefined ? previousEnabled : true
          };
          if (module.engine === "expander") {
            entry.kind = payload.kind;
            if (payload.kind === "static") entry.value = payload.value;
            if (payload.kind === "translate") entry.lang = payload.lang;
            if (payload.kind === "ai") entry.instruction = payload.instruction;
          } else {
            entry.description = payload.description;
          }
          return entry;
        }

        function handleAddTrigger(config, payload) {
          const module = config.modules[payload.moduleId];
          module.triggers[payload.trigger] = buildTriggerEntry(module, payload);
          return {
            ok: true,
            needsRestart: false,
            message: "Gatilho adicionado"
          };
        }

        function handleUpdateTrigger(config, payload) {
          const module = config.modules[payload.moduleId];
          const previous = module.triggers[payload.originalTrigger];
          const entry = buildTriggerEntry(
            module,
            payload,
            previous ? previous.enabled : undefined
          );
          if (payload.originalTrigger !== payload.trigger) {
            delete module.triggers[payload.originalTrigger];
          }
          module.triggers[payload.trigger] = entry;
          return {
            ok: true,
            needsRestart: false,
            message: "Gatilho atualizado"
          };
        }

        function handleRemoveTrigger(config, payload) {
          delete config.modules[payload.moduleId].triggers[payload.trigger];
          return { ok: true, needsRestart: false, message: "Gatilho removido" };
        }

        function handleToggleTrigger(config, payload) {
          config.modules[payload.moduleId].triggers[payload.trigger].enabled =
            payload.enabled;
          return {
            ok: true,
            needsRestart: false,
            message: "Gatilho atualizado"
          };
        }

        const handlers = {
          get_status: (config, payload) => handleGetStatus(config, payload),
          toggle_monitor: () => handleToggleMonitor(),
          toggle_module: handleToggleModule,
          update_module_config: handleUpdateModuleConfig,
          add_trigger: handleAddTrigger,
          update_trigger: handleUpdateTrigger,
          remove_trigger: handleRemoveTrigger,
          toggle_trigger: handleToggleTrigger
        };

        async function readConfig() {
          return deepClone(ensureStore());
        }

        async function runAction(action, payload) {
          const config = ensureStore();
          const handler = handlers[action];
          if (!handler)
            return { ok: false, error: `Ação desconhecida: ${action}` };
          return handler(config, payload || {});
        }

        return { isAvailable: () => true, readConfig, runAction };
      }

      function selectEnvironment() {
        const taskerEnvironment = createTaskerEnvironment();
        return taskerEnvironment.isAvailable()
          ? taskerEnvironment
          : createWebEnvironment(DEFAULT_CONFIG);
      }

      const environment = selectEnvironment();

      const appState = {
        monitorActive: false,
        activeModuleIds: [],
        config: { monitorEnabled: false, modules: {} },
        activeTab: null
      };

      async function refreshConfig() {
        const config = await environment.readConfig();
        if (config) appState.config = config;
      }

      function applyResponseToState(response) {
        if (typeof response.monitorActive === "boolean") {
          appState.monitorActive = response.monitorActive;
        }
        if (Array.isArray(response.activeModuleIds)) {
          appState.activeModuleIds = response.activeModuleIds;
        }
      }

      async function performAction(action, payload) {
        setLoadingVisible(true);
        const response = await environment.runAction(action, payload || {});
        applyResponseToState(response);
        await refreshConfig();
        renderApp();
        setLoadingVisible(false);

        const feedback = response.error || response.message;
        if (feedback) showToast(feedback, response.ok === false);
        if (response.needsRestart) showRestartBanner(true);

        return response.ok !== false;
      }

      let toastTimer = null;
      function showToast(message, isError) {
        const box = document.getElementById("toast");
        const msg = document.getElementById("toastMsg");
        const label = document.getElementById("toastText");
        label.textContent = message;
        msg.className = `msg ${isError ? "err" : "ok"}`;
        box.style.display = "flex";
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => {
          box.style.display = "none";
        }, 3200);
      }

      function showRestartBanner(show) {
        document.getElementById("banner").style.display = show
          ? "flex"
          : "none";
      }

      function setLoadingVisible(visible) {
        document.getElementById("loading").style.display = visible
          ? "flex"
          : "none";
      }

      function ensureActiveTab() {
        const ids = Object.keys(appState.config.modules || {});
        if (!appState.activeTab || ids.indexOf(appState.activeTab) === -1) {
          appState.activeTab = ids[0] || null;
        }
      }

      function renderApp() {
        ensureActiveTab();
        renderMasterPower();
        renderTabs();
        renderPage();
      }

      function renderMasterPower() {
        document.getElementById("masterSwitch").checked =
          appState.monitorActive;
        document.getElementById("masterLed").className =
          `led ${appState.monitorActive ? "on" : "off"}`;
        document.getElementById("masterState").textContent =
          appState.monitorActive ? "ATIVO" : "PARADO";
      }

      function renderTabs() {
        const bar = document.getElementById("tabBar");
        bar.innerHTML = "";
        const modules = appState.config.modules || {};
        Object.keys(modules).forEach(id => {
          const tab = el(
            "button",
            `tab${id === appState.activeTab ? " active" : ""}`,
            modules[id].displayName
          );
          tab.addEventListener("click", () => {
            appState.activeTab = id;
            renderApp();
          });
          bar.appendChild(tab);
        });
      }

      function renderPage() {
        const page = document.getElementById("page");
        page.innerHTML = "";
        const id = appState.activeTab;
        if (!id) return;
        const module = appState.config.modules[id];
        page.appendChild(renderPageHead(id, module));
        page.appendChild(renderTriggerSection(id, module));
      }

      function renderModuleSwitchSm(id, module) {
        const wrapper = el("label", "switch sm");
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!module.enabled;
        input.addEventListener("change", () => {
          performAction("toggle_module", { id, enabled: input.checked });
        });
        wrapper.appendChild(input);
        wrapper.appendChild(el("span", "track"));
        wrapper.appendChild(el("span", "knob"));
        return wrapper;
      }

      function renderPageHead(id, module) {
        const head = el("div", "page-head");

        const top = el("div", "page-head-top");
        top.appendChild(el("h2", null, module.displayName));

        const actions = el("div", "page-head-actions");

        const settingsBtn = iconButton(
          "icon-btn",
          "settings",
          "Configurações do módulo"
        );
        settingsBtn.addEventListener("click", () =>
          openModuleSettingsDialog(id, module)
        );
        actions.appendChild(settingsBtn);

        actions.appendChild(renderModuleSwitchSm(id, module));
        top.appendChild(actions);
        head.appendChild(top);

        const tokens = Object.keys(module.triggers || {});
        const activeCount = tokens.filter(
          t => module.triggers[t].enabled
        ).length;
        const stats = el("div", "page-stats");

        const statsInfo = el("div", "page-stats-info");
        statsInfo.appendChild(
          el(
            "span",
            "count",
            `${tokens.length} gatilho(s) · ${activeCount} ativo(s)`
          )
        );
        if (appState.activeModuleIds.indexOf(id) >= 0) {
          statsInfo.appendChild(el("span", "chip ok", "registrado"));
        }
        stats.appendChild(statsInfo);

        const addBtn = document.createElement("button");
        addBtn.className = "btn-header-add";
        addBtn.innerHTML = `${ICONS.plus}<span>Adicionar</span>`;
        addBtn.addEventListener("click", () =>
          openTriggerDialog(id, module, null)
        );
        stats.appendChild(addBtn);

        head.appendChild(stats);

        return head;
      }

      function createLabeledTextRow(parent, labelText, value) {
        const row = el("div", "field-row");
        row.appendChild(el("label", null, labelText));
        const input = document.createElement("input");
        input.type = "text";
        input.value = value || "";
        row.appendChild(input);
        parent.appendChild(row);
        return input;
      }

      function createLabeledCheckboxRow(parent, labelText, checked) {
        const row = el("div", "field-row");
        row.appendChild(el("label", null, labelText));
        const input = document.createElement("input");
        input.type = "checkbox";
        input.checked = !!checked;
        row.appendChild(input);
        parent.appendChild(row);
        return input;
      }

      function createLabeledTextareaBlock(
        parent,
        labelText,
        value,
        placeholder
      ) {
        const block = el("div", "field-block");
        block.appendChild(el("label", "block-label", labelText));
        const textarea = document.createElement("textarea");
        textarea.value = value || "";
        if (placeholder) textarea.placeholder = placeholder;
        block.appendChild(textarea);
        parent.appendChild(block);
        return textarea;
      }

      function buildCommandSettingsFields(body, module) {
        const config = module.config || {
          prefix: ">>",
          taskName: "",
          restrictToKnown: false
        };
        const prefixInput = createLabeledTextRow(
          body,
          "Prefixo",
          config.prefix
        );
        const taskInput = createLabeledTextRow(body, "Tarefa", config.taskName);
        const restrictInput = createLabeledCheckboxRow(
          body,
          "Somente listados",
          config.restrictToKnown
        );
        body.appendChild(
          el(
            "div",
            "hint",
            "Tarefa do Tasker chamada quando um comando reconhecido é digitado."
          )
        );
        return {
          collect: () => ({
            prefix: prefixInput.value.trim() || ">>",
            taskName: taskInput.value.trim(),
            restrictToKnown: restrictInput.checked
          })
        };
      }

      function buildExpanderSettingsFields(body, module) {
        const config = module.config || {
          apiKey: "",
          model: "",
          systemInstructions: ""
        };
        const apiKeyInput = createLabeledTextRow(
          body,
          "Chave API",
          config.apiKey
        );
        apiKeyInput.placeholder = "Chave da API Gemini";
        const modelInput = createLabeledTextRow(body, "Modelo", config.model);
        modelInput.placeholder = "ex: gemini-2.5-flash";
        const sysTextarea = createLabeledTextareaBlock(
          body,
          "Instruções do sistema",
          config.systemInstructions,
          "Opcional — aplica-se a todos os gatilhos do tipo IA"
        );
        body.appendChild(
          el(
            "div",
            "hint",
            "Usadas pelo gatilho do tipo IA para gerar respostas via Gemini."
          )
        );
        return {
          collect: () => ({
            apiKey: apiKeyInput.value.trim(),
            model: modelInput.value.trim(),
            systemInstructions: sysTextarea.value.trim()
          })
        };
      }

      let dialogKeyHandler = null;

      function closeDialog() {
        const overlay = document.querySelector(".dialog-overlay");
        if (overlay) overlay.remove();
        if (dialogKeyHandler) {
          document.removeEventListener("keydown", dialogKeyHandler);
          dialogKeyHandler = null;
        }
      }

      function openModuleSettingsDialog(moduleId, module) {
        closeDialog();

        const overlay = el("div", "dialog-overlay");
        const dialog = el("div", "dialog");

        const head = el("div", "dialog-head");
        head.appendChild(
          el("b", null, `Configurações · ${module.displayName}`)
        );
        const closeBtn = iconButton("dialog-close", "close", "Fechar");
        closeBtn.addEventListener("click", closeDialog);
        head.appendChild(closeBtn);
        dialog.appendChild(head);

        const body = el("div", "dialog-body");
        dialog.appendChild(body);

        const fields =
          module.engine === "command"
            ? buildCommandSettingsFields(body, module)
            : buildExpanderSettingsFields(body, module);

        const foot = el("div", "dialog-foot");
        const cancelBtn = el("button", "btn btn-ghost", "Cancelar");
        cancelBtn.addEventListener("click", closeDialog);
        const saveBtn = el("button", "btn btn-accent", "Salvar");
        saveBtn.addEventListener("click", async () => {
          const success = await performAction("update_module_config", {
            moduleId,
            config: fields.collect()
          });
          if (success) closeDialog();
        });
        foot.appendChild(cancelBtn);
        foot.appendChild(saveBtn);
        dialog.appendChild(foot);

        overlay.appendChild(dialog);
        overlay.addEventListener("click", event => {
          if (event.target === overlay) closeDialog();
        });
        dialogKeyHandler = event => {
          if (event.key === "Escape") closeDialog();
        };
        document.addEventListener("keydown", dialogKeyHandler);

        document.body.appendChild(overlay);
      }

      function describeTrigger(module, trigger) {
        if (module.engine === "command") {
          return trigger.description ? trigger.description : "Sem descrição";
        }
        if (trigger.kind === "static") return trigger.value || "";
        if (trigger.kind === "translate")
          return `Traduz para ${LANG_LABELS[trigger.lang] || trigger.lang}`;
        if (trigger.kind === "ai")
          return trigger.instruction ? trigger.instruction : "Pergunta livre";
        if (trigger.kind === "youtube") return "Busca no YouTube";
        return "";
      }

      function renderTriggerRow(moduleId, module, token, trigger) {
        const row = el("div", `trigger-row${trigger.enabled ? "" : " off"}`);

        const dot = el("span", "trigger-dot");
        dot.title = "Habilitar/desabilitar";
        dot.addEventListener("click", () => {
          performAction("toggle_trigger", {
            moduleId,
            trigger: token,
            enabled: !trigger.enabled
          });
        });
        row.appendChild(dot);

        const info = el("div", "trigger-info");
        const top = el("div", "trigger-top");
        top.appendChild(el("span", "trigger-token", token));
        top.appendChild(
          el(
            "span",
            "trigger-kind",
            module.engine === "expander" ? KIND_LABEL[trigger.kind] : "comando"
          )
        );
        info.appendChild(top);
        info.appendChild(
          el("div", "trigger-value", describeTrigger(module, trigger))
        );
        row.appendChild(info);

        const actions = el("div", "trigger-actions");
        const editBtn = iconButton("icon-btn", "edit", "Editar");
        editBtn.addEventListener("click", () =>
          openTriggerDialog(moduleId, module, token)
        );
        const delBtn = iconButton("icon-btn danger", "trash", "Remover");
        delBtn.addEventListener("click", () =>
          performAction("remove_trigger", { moduleId, trigger: token })
        );
        actions.appendChild(editBtn);
        actions.appendChild(delBtn);
        row.appendChild(actions);

        return row;
      }

      function renderTriggerSection(id, module) {
        const section = el("div", "section");
        section.appendChild(
          el(
            "div",
            "section-label",
            module.engine === "command" ? "Comandos" : "Gatilhos"
          )
        );

        const triggers = module.triggers || {};
        const tokens = Object.keys(triggers);
        if (tokens.length > 0) {
          const list = el("div", "trigger-list");
          tokens.forEach(token =>
            list.appendChild(
              renderTriggerRow(id, module, token, triggers[token])
            )
          );
          section.appendChild(list);
        } else {
          section.appendChild(
            el("div", "empty-hint", "Nenhum gatilho cadastrado ainda.")
          );
        }

        return section;
      }

      function createKindSelect() {
        const select = document.createElement("select");
        ["static", "translate", "ai", "youtube"].forEach(kind => {
          const option = document.createElement("option");
          option.value = kind;
          option.textContent = KIND_LABEL[kind];
          select.appendChild(option);
        });
        return select;
      }

      function buildExpanderExtraField(kind) {
        if (kind === "static") {
          const textarea = document.createElement("textarea");
          textarea.placeholder = "Texto a inserir";
          return { element: textarea, input: textarea, name: "value" };
        }
        if (kind === "translate") {
          const select = document.createElement("select");
          LANG_OPTIONS.forEach(([value, label]) => {
            const option = document.createElement("option");
            option.value = value;
            option.textContent = label;
            select.appendChild(option);
          });
          return { element: select, input: select, name: "lang" };
        }
        if (kind === "ai") {
          const textarea = document.createElement("textarea");
          textarea.placeholder = "Instrução para a IA (vazio = pergunta livre)";
          return { element: textarea, input: textarea, name: "instruction" };
        }
        return { element: el("div"), input: null, name: "none" };
      }

      async function submitTriggerDialog(
        moduleId,
        module,
        rules,
        originalToken,
        tokenInput,
        kindSelect,
        extraFields,
        descriptionInput
      ) {
        const token = tokenInput.value.trim().toLowerCase();
        if (!rules.pattern.test(token)) {
          showToast(`Gatilho inválido: ${rules.hint}`, true);
          return;
        }

        const payload = { moduleId, trigger: token };
        if (module.engine === "expander") {
          payload.kind = kindSelect.value;
          if (payload.kind === "static")
            payload.value = extraFields.value ? extraFields.value.value : "";
          if (payload.kind === "translate")
            payload.lang = extraFields.lang ? extraFields.lang.value : "en";
          if (payload.kind === "ai")
            payload.instruction = extraFields.instruction
              ? extraFields.instruction.value
              : "";
        } else {
          payload.description = descriptionInput ? descriptionInput.value : "";
        }

        const action = originalToken ? "update_trigger" : "add_trigger";
        if (originalToken) payload.originalTrigger = originalToken;

        const success = await performAction(action, payload);
        if (success) closeDialog();
      }

      function openTriggerDialog(moduleId, module, existingToken) {
        closeDialog();
        const isEdit = existingToken != null;
        const isCommand = module.engine === "command";
        const existingTrigger = isEdit ? module.triggers[existingToken] : null;
        const rules = TRIGGER_RULES[module.engine];

        const overlay = el("div", "dialog-overlay");
        const dialog = el("div", "dialog");

        const head = el("div", "dialog-head");
        const title = isEdit
          ? isCommand
            ? "Editar comando"
            : "Editar gatilho"
          : isCommand
            ? "Novo comando"
            : "Novo gatilho";
        head.appendChild(el("b", null, title));
        const closeBtn = iconButton("dialog-close", "close", "Fechar");
        closeBtn.addEventListener("click", closeDialog);
        head.appendChild(closeBtn);
        dialog.appendChild(head);

        const body = el("div", "dialog-body");
        dialog.appendChild(body);

        const tokenRow = el("div", "field-row");
        tokenRow.appendChild(
          el("label", null, isCommand ? "Comando" : "Gatilho")
        );
        const tokenInput = document.createElement("input");
        tokenInput.type = "text";
        tokenInput.value = existingToken || "";
        tokenInput.placeholder = isCommand ? "comando" : "novo:";
        tokenRow.appendChild(tokenInput);
        body.appendChild(tokenRow);

        let kindSelect = null;
        const extraWrap = el("div");
        const extraFields = { value: null, lang: null, instruction: null };

        function refreshExtraFields(prefill) {
          extraWrap.innerHTML = "";
          extraFields.value = null;
          extraFields.lang = null;
          extraFields.instruction = null;
          const built = buildExpanderExtraField(kindSelect.value);
          extraWrap.appendChild(built.element);
          extraFields[built.name] = built.input;
          if (prefill && built.input) {
            if (built.name === "value") built.input.value = prefill.value || "";
            if (built.name === "lang") built.input.value = prefill.lang || "en";
            if (built.name === "instruction")
              built.input.value = prefill.instruction || "";
          }
        }

        if (!isCommand) {
          const kindRow = el("div", "field-row");
          kindRow.appendChild(el("label", null, "Tipo"));
          kindSelect = createKindSelect();
          if (existingTrigger) kindSelect.value = existingTrigger.kind;
          kindRow.appendChild(kindSelect);
          body.appendChild(kindRow);
          body.appendChild(extraWrap);
          kindSelect.addEventListener("change", () => refreshExtraFields(null));
          refreshExtraFields(existingTrigger);
        }

        let descriptionInput = null;
        if (isCommand) {
          const descRow = el("div", "field-row");
          descRow.appendChild(el("label", null, "Descrição"));
          descriptionInput = document.createElement("input");
          descriptionInput.type = "text";
          descriptionInput.value = existingTrigger
            ? existingTrigger.description || ""
            : "";
          descriptionInput.placeholder = "opcional";
          descRow.appendChild(descriptionInput);
          body.appendChild(descRow);
        }

        body.appendChild(el("div", "hint", rules.hint));

        const foot = el("div", "dialog-foot");
        const cancelBtn = el("button", "btn btn-ghost", "Cancelar");
        cancelBtn.addEventListener("click", closeDialog);
        const saveBtn = el("button", "btn btn-accent", "Salvar");
        saveBtn.addEventListener("click", () => {
          submitTriggerDialog(
            moduleId,
            module,
            rules,
            isEdit ? existingToken : null,
            tokenInput,
            kindSelect,
            extraFields,
            descriptionInput
          );
        });
        foot.appendChild(cancelBtn);
        foot.appendChild(saveBtn);
        dialog.appendChild(foot);

        overlay.appendChild(dialog);
        overlay.addEventListener("click", event => {
          if (event.target === overlay) closeDialog();
        });
        dialogKeyHandler = event => {
          if (event.key === "Escape") closeDialog();
        };
        document.addEventListener("keydown", dialogKeyHandler);

        document.body.appendChild(overlay);
        tokenInput.focus();
      }

      function bindGlobalEvents() {
        document
          .getElementById("masterSwitch")
          .addEventListener("change", () => {
            performAction("toggle_monitor", {});
          });

        document
          .getElementById("restartBtn")
          .addEventListener("click", async () => {
            showRestartBanner(false);
            await performAction("toggle_monitor", {});
            await sleep(400);
            await performAction("toggle_monitor", {});
          });
      }

      async function boot() {
        bindGlobalEvents();
        await performAction("get_status", {});
      }

      boot();
    </script>
  </body>
</html>
